<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F5F4EF">
<meta http-equiv="x-ua-compatible" content="ie=edge">

{%- seo -%}
<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | absolute_url }}">
<link rel="sitemap" type="application/xml" href="{{ '/sitemap.xml' | absolute_url }}">

<link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "EtsyMargin",
  "url": "{{ site.url }}/",
  "logo": "{{ site.url }}{{ site.logo }}",
  "sameAs": []
}
</script>
{% include breadcrumb-schema.html %}
{% include faq-schema.html %}
</head>
<body>
{% include header.html %}
<main id="main">
  {{ content }}
</main>
{% include footer.html %}
<script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
{% if page.calculator %}<script src="{{ '/assets/js/calculator.js' | relative_url }}" defer></script>{% endif %}
</body>
</html>
